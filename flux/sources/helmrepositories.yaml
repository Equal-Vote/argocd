# Chart sources for the Flux-managed apps, mirrored from the chartURL fields in
# applications/*/config.json so both systems pull identical charts during the
# transition.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
# Anonymous pull works -- verified 2026-09-08 by fetching a token from
# gitlab.com/jwt/auth with no credentials and pulling the manifests for both
# 0.11.0 and 0.8.2. No imagePullSecret is required. The chart is a generic
# in-house app wrapper (Deployment/Service/Ingress/ServiceAccount) shared by
# fider, star-server, alaska-rcv and discord-bot -- nothing fider-specific.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: devopscoop
  namespace: flux-system
spec:
  type: oci
  interval: 1h
  url: oci://registry.gitlab.com/devopscoop/charts
