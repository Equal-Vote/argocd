# dyff between <(yq . <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0)) <(yq eval '. * load("values.yaml")' <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0))
# vim -O <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0) values.yaml

# We can't monitor the Azure AKS control plane services
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # AKS puts its apiserver replicas behind a single load-balanced endpoint, so all
    # of them report as one Prometheus series and their rest_client_requests_total
    # counters interleave. Every scrape that lands on a replica with a lower counter
    # than the previous scrape looks like a counter reset, so rate() invents traffic
    # that never happened. KubeClientErrors divides one such bogus rate by another,
    # which makes it fire at random. It is scoped to job="apiserver", and that is the
    # only control plane job we can scrape, so turning it off costs no real coverage.
    # Genuine apiserver problems still page via KubeAPIDown / KubeAPIErrorBudgetBurn.
    KubeClientErrors: true

# NOTE: `nodeExporter` is the PARENT chart's key -- it only toggles the subchart
# and configures its ServiceMonitor, and has no `resources` field. Anything set
# under it is silently dropped, which left the DaemonSet with no requests at all
# on every node. Container resources belong to the subchart, named
# `prometheus-node-exporter` (no alias in Chart.yaml).
# Verify: helm template ... | yq 'select(.kind=="DaemonSet").spec.template.spec.containers[0].resources'
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
alertmanager:
  config:
    route:
      # Uncomment this if alerts are too spammy.
      # group_by: ["alertname"]
      receiver: "slack"

      # Configuring some alerts to go into the void...
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "InfoInhibitor"
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"

    receivers:
    - name: "null"
    - name: "slack"
      # https://prometheus.io/docs/alerting/latest/configuration/#slack_config
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_webhook_url
        channel: "#_bettervoting"
        send_resolved: true
        # TODO: Should we enable this?
        # https://prometheus.io/docs/alerting/latest/notification_examples/#ranging-over-all-received-alerts
        # title: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        # text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  alertmanagerSpec:
    # NOTE: must live under alertmanagerSpec, not on `alertmanager` directly --
    # the parent key has no `resources` field, so setting it there is dropped and
    # the Alertmanager CR renders with no requests or limits at all.
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    secrets:
    - alertmanager-slack
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: "basic"
      nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
      nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    hosts:
    - alertmanager.prod.equal.vote
    tls:
    - secretName: alertmanager-tls
      hosts:
      - alertmanager.prod.equal.vote
prometheus:
  prometheusSpec:
    # Sized for the election load study. Measured 2026-09-22: 66,051 active
    # series at 412Mi, i.e. ~6.4KB/series, against a 440Mi limit -- 94% full
    # before any extra load. Enabling ingress-nginx metrics adds per-ingress
    # histogram series on top of that, so the old limit would OOM the very
    # Prometheus collecting the election data. 2Gi leaves room for the new
    # series plus growth; memory request == limit so kubelet eviction, which
    # ranks on usage over request, puts this last in line.
    resources:
      requests:
        cpu: 76m
        memory: 2Gi
      limits:
        memory: 2Gi
    # NOTE: the key is `storageSpec`, NOT `storage`. Alertmanager above uses
    # `alertmanagerSpec.storage`, but prometheusSpec spells it `storageSpec`.
    # Helm does not error on unknown values keys, so the wrong spelling is
    # silently dropped and the operator falls back to an emptyDir -- metrics
    # then die with the pod and `retention` below is decorative.
    # Verify after any edit here:
    #   kubectl get prometheus -n kube-prometheus-stack -o jsonpath='{.items[0].spec.storage}'
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              # Measured 2026-09-22: 10d of retention = 3.67Gi of blocks + 271Mi
              # of WAL at 66k active series / 30s scrape. 16Gi is ~4x that, which
              # leaves room for compaction and for series growth under election
              # load. Also lands exactly on the Azure Standard SSD E3 tier.
              storage: 16Gi
    # Safety valve: prune before the filesystem fills. A full disk wedges the
    # TSDB, which loses far more than aging data out does. Kept at 75% of the
    # PVC because retention.size does not account for the WAL.
    retentionSize: 12GiB
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: "basic"
      nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
      nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    hosts:
    - prometheus.prod.equal.vote
    tls:
    - secretName: prometheus-tls
      hosts:
      - prometheus.prod.equal.vote
grafana:
  # 512Mi, not the 232Mi KRR recommended on 2026-05-04. That number was measured
  # against Grafana 12.4.2 (chart 82.17.1), which peaked at 184Mi. Chart 90.0.0
  # ships Grafana 13.2.1, whose unified-storage bleve search index and background
  # plugin installer put the idle floor at ~213Mi, so every dashboard load crossed
  # 232Mi and got the container OOMKilled -- which is what ingress-nginx turned
  # into 502/503s. Do not lower this from a KRR run taken while the old limit was
  # clamping the peak; re-measure with headroom first.
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
  admin:
    existingSecret: grafana
  additionalDataSources:
  - name: loki
    type: loki
    url: http://loki.loki:3100
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
    - grafana.prod.equal.vote
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.prod.equal.vote

  # --- ingress-nginx dashboard -------------------------------------------------
  # Shipped here rather than from the ingress-nginx app because chart 4.15.1 has
  # no extraObjects hook, so that app cannot emit a bare ConfigMap.
  #
  # It also cannot go through the dashboard sidecar via grafana.extraObjects:
  # the grafana subchart runs `tpl` over extraObjects, and this dashboard's
  # Prometheus legends contain {{ ingress }} / {{ destination_service }}, which
  # Go templating then tries to evaluate as functions and fails the render.
  # grafana.dashboards is copied verbatim into a ConfigMap with no tpl pass.
  #
  # This is additive: the sidecar provider still serves the ~26 built-in
  # kube-prometheus-stack dashboards. Source is the upstream dashboard from
  # kubernetes/ingress-nginx (deploy/grafana/dashboards/nginx.json), with the
  # __inputs/__requires import stanzas stripped and the datasource variable
  # pinned to this cluster's Prometheus (uid: prometheus) so it resolves on load.
  #
  # Requires controller.metrics.enabled in applications/ingress-nginx/values.yaml
  # -- without it the panels render but stay empty.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: ingress-nginx
        orgId: 1
        folder: "Ingress NGINX"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/ingress-nginx
  dashboards:
    ingress-nginx:
      ingress-nginx:
        json: |
          {
            "__elements": {},
            "annotations": {
              "list": [
                {
                  "builtIn": 1,
                  "datasource": {
                    "type": "datasource",
                    "uid": "grafana"
                  },
                  "enable": true,
                  "hide": true,
                  "iconColor": "rgba(0, 211, 255, 1)",
                  "name": "Annotations & Alerts",
                  "type": "dashboard"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${DS_PROMETHEUS}"
                  },
                  "enable": true,
                  "expr": "sum(changes(nginx_ingress_controller_config_last_reload_successful_timestamp_seconds{instance!=\"unknown\",controller_class=~\"$controller_class\",namespace=~\"$namespace\"}[30s])) by (controller_class)",
                  "hide": false,
                  "iconColor": "rgba(255, 96, 96, 1)",
                  "limit": 100,
                  "name": "Config Reloads",
                  "showIn": 0,
                  "step": "30s",
                  "tagKeys": "controller_class",
                  "tags": [],
                  "titleFormat": "Config Reloaded",
                  "type": "tags"
                }
              ]
            },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "links": [],
            "panels": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "${DS_PROMETHEUS}"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "fixedColor": "rgb(31, 120, 193)",
                      "mode": "fixed"
                    },
                    "mappings": [
                      {
                        "options": {
                          "match": "null",
                          "result": {
                            "text": "N/A"
                          }
                        },
                        "type": "special"
                      }
                    ],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 80
                        }
                      ]
                    },
                    "unit": "ops"
                  },
                  "overrides": []
                },
                "id": 20,
                "maxDataPoints": 100,
                "options": {
                  "colorMode": "none",
                  "graphMode": "area",
                  "justifyMode": "auto",
                  "orientation": "horizontal",
                  "reduceOptions": {
                    "calcs": [
                      "mean"
                    ],
                    "fields": "",
