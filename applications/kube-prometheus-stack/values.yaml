    postgresql:
      postgresql-bitnami:
        # --- Bitnami PostgreSQL dashboard ------------------------------------
        # Same reasoning as the ingress-nginx dashboard above: grafana.dashboards
        # is copied into a ConfigMap verbatim, with no tpl pass, so it is the one
        # injection point that tolerates arbitrary dashboard JSON. Both of the
        # alternatives run Go templating over the payload -- the postgresql chart's
        # extraDeploy does it whenever the value contains a brace pair, and
        # kube-prometheus-stack's extraManifests does it unconditionally.
        #
        # This dashboard is written with no {} brace pairs at all so it stays safe
        # either way: series are named with Grafana's ${__field.labels.X} displayName
        # syntax and byFrameRefID overrides rather than legendFormat. Keep it that
        # way if you edit it.
        #
        # Scoped by namespace/job template variables rather than hardcoded to one
        # release, so a second Bitnami PostgreSQL shows up here with no changes.
        # fider-db is CloudNativePG, not Bitnami, and exports different metrics --
        # it is not covered by this dashboard.
        #
        # Metric names were taken from postgres_exporter v0.15.0, which is what
        # chart 15.2.9 pins. Two traps live in that set: pg_stat_bgwriter_* carries
        # a _total suffix while pg_stat_database_* does not, and the pg_postmaster
        # collector is registered defaultDisabled, so there is deliberately no
        # uptime panel here.
        #
        # Requires metrics.enabled and metrics.serviceMonitor in
        # applications/postgresql/values.yaml -- without those the panels render
        # but stay empty.
        json: |
          {
           "uid": "bitnami-postgresql",
           "title": "PostgreSQL (Bitnami)",
           "description": "Health, throughput and tuning signals for Bitnami PostgreSQL instances scraped by postgres_exporter. Panel descriptions name the postgresql.conf setting each signal maps to.",
           "tags": [
            "postgresql",
            "bitnami",
            "database"
           ],
           "timezone": "browser",
           "schemaVersion": 39,
           "version": 1,
           "editable": true,
           "graphTooltip": 1,
           "refresh": "30s",
           "time": {
            "from": "now-6h",
            "to": "now"
           },
           "templating": {
            "list": [
             {
              "name": "datasource",
              "label": "Data source",
              "type": "datasource",
              "query": "prometheus",
              "current": {
               "text": "Prometheus",
               "value": "prometheus"
              }
             },
             {
              "name": "namespace",
              "label": "Namespace",
              "type": "query",
              "datasource": {
               "type": "prometheus",
               "uid": "${datasource}"
              },
              "query": {
               "qryType": 1,
               "query": "label_values(pg_up, namespace)",
               "refId": "var-namespace"
              },
              "definition": "label_values(pg_up, namespace)",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*"
             },
             {
              "name": "job",
              "label": "Instance",
              "type": "query",
              "datasource": {
               "type": "prometheus",
               "uid": "${datasource}"
              },
              "query": {
               "qryType": 1,
               "query": "label_values(pg_up{namespace=~\"$namespace\"}, job)",
               "refId": "var-job"
              },
              "definition": "label_values(pg_up{namespace=~\"$namespace\"}, job)",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*"
             },
             {
              "name": "datname",
              "label": "Database",
              "type": "query",
              "datasource": {
               "type": "prometheus",
               "uid": "${datasource}"
              },
              "query": {
               "qryType": 1,
               "query": "label_values(pg_stat_database_numbackends{namespace=~\"$namespace\", job=~\"$job\", datname!~\"template.*|postgres\"}, datname)",
               "refId": "var-datname"
              },
              "definition": "label_values(pg_stat_database_numbackends{namespace=~\"$namespace\", job=~\"$job\", datname!~\"template.*|postgres\"}, datname)",
              "refresh": 2,
              "multi": true,
              "includeAll": true,
              "allValue": ".*"
             }
            ]
           },
           "panels": [
            {
             "id": 1,
             "type": "row",
             "title": "Health",
             "gridPos": {
              "x": 0,
              "y": 0,
              "w": 24,
              "h": 1
             }
            },
            {
             "id": 2,
             "type": "stat",
             "title": "Exporter / server up",
             "description": "pg_up from postgres_exporter. 0 means the exporter cannot reach PostgreSQL.",
             "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
             },
             "gridPos": {
              "x": 0,
              "y": 1,
              "w": 4,
              "h": 4
             },
             "targets": [
              {
               "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
               },
               "expr": "min(pg_up{namespace=~\"$namespace\", job=~\"$job\"})",
               "refId": "A"
              }
             ],
             "fieldConfig": {
              "defaults": {
               "color": {
                "mode": "thresholds"
               },
               "unit": "short",
               "mappings": [
                {
                 "type": "value",
                 "options": {
                  "0": {
                   "text": "DOWN",
                   "color": "red",
                   "index": 0
                  },
                  "1": {
                   "text": "UP",
                   "color": "green",
                   "index": 1
                  }
                 }
                }
               ],
               "thresholds": {
                "mode": "absolute",
                "steps": [
                 {
                  "color": "red",
                  "value": null
                 },
                 {
                  "color": "green",
                  "value": 1
                 }
                ]
               }
              }
             },
             "options": {
              "reduceOptions": {
               "calcs": [
                "lastNotNull"
               ]
              },
              "graphMode": "none",
              "colorMode": "value"
             }
            },
            {
             "id": 3,
             "type": "gauge",
             "title": "Connection saturation",
             "description": "Backends as a percentage of max_connections. Connection exhaustion surfaces here well before memory does; PostgreSQL refuses new connections at 100%.",
             "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
             },
             "gridPos": {
              "x": 4,
              "y": 1,
              "w": 5,
              "h": 4
             },
             "targets": [
              {
               "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
               },
               "expr": "100 * sum by (job) (pg_stat_database_numbackends{namespace=~\"$namespace\", job=~\"$job\", datname=~\"$datname\"})\n  / on (job) group_left max by (job) (pg_settings_max_connections{namespace=~\"$namespace\", job=~\"$job\"})",
               "refId": "A"
              }
             ],
             "fieldConfig": {
              "defaults": {
               "color": {
                "mode": "thresholds"
               },
               "unit": "percent",
               "min": 0,
               "max": 100,
               "decimals": 1,
               "thresholds": {
                "mode": "absolute",
                "steps": [
                 {
                  "color": "green",
                  "value": null
                 },
                 {
                  "color": "yellow",
                  "value": 70
                 },
                 {
                  "color": "red",
                  "value": 85
                 }
                ]
               }
              }
             },
             "options": {
              "reduceOptions": {
               "calcs": [
                "lastNotNull"
               ]
              },
              "showThresholdLabels": false,
              "showThresholdMarkers": true
             }
            },
            {
             "id": 4,
             "type": "stat",
             "title": "Backends",
             "description": "Current backends against the configured max_connections ceiling.",
             "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
             },
             "gridPos": {
              "x": 9,
              "y": 1,
              "w": 5,
              "h": 4
             },
             "targets": [
              {
               "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
               },
               "expr": "sum(pg_stat_database_numbackends{namespace=~\"$namespace\", job=~\"$job\", datname=~\"$datname\"})",
               "refId": "A"
              },
              {
               "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
               },
               "expr": "max(pg_settings_max_connections{namespace=~\"$namespace\", job=~\"$job\"})",
               "refId": "B"
              }
             ],
             "fieldConfig": {
              "defaults": {
               "color": {
                "mode": "thresholds"
               },
               "unit": "short",
               "thresholds": {
                "mode": "absolute",
                "steps": [
                 {
                  "color": "text",
                  "value": null
                 }
                ]
               }
              },
              "overrides": [
               {
                "matcher": {
                 "id": "byFrameRefID",
                 "options": "A"
                },
                "properties": [
                 {
                  "id": "displayName",
                  "value": "in use"
                 }
                ]
               },
               {
                "matcher": {
                 "id": "byFrameRefID",
                 "options": "B"
                },
                "properties": [
                 {
                  "id": "displayName",
                  "value": "max_connections"
                 }
                ]
               }
              ]
             },
             "options": {
              "reduceOptions": {
               "calcs": [
                "lastNotNull"
               ]
              },
              "graphMode": "area",
              "colorMode": "value"
             }
            },
            {
             "id": 5,
             "type": "stat",
             "title": "Database size",
             "description": "On-disk size of the selected databases.",
             "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
             },
             "gridPos": {
              "x": 14,
              "y": 1,
              "w": 5,
              "h": 4
             },
             "targets": [
              {
               "datasource": {
