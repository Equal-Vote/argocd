# dyff between <(yq . <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0)) <(yq eval '. * load("values.yaml")' <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0))
# vim -O <(helm show values prometheus-community/kube-prometheus-stack --version v90.0.0) values.yaml

# We can't monitor the Azure AKS control plane services
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # AKS puts its apiserver replicas behind a single load-balanced endpoint, so all
    # of them report as one Prometheus series and their rest_client_requests_total
    # counters interleave. Every scrape that lands on a replica with a lower counter
    # than the previous scrape looks like a counter reset, so rate() invents traffic
    # that never happened. KubeClientErrors divides one such bogus rate by another,
    # which makes it fire at random. It is scoped to job="apiserver", and that is the
    # only control plane job we can scrape, so turning it off costs no real coverage.
    # Genuine apiserver problems still page via KubeAPIDown / KubeAPIErrorBudgetBurn.
    KubeClientErrors: true

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
alertmanager:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
  config:
    route:
      # Uncomment this if alerts are too spammy.
      # group_by: ["alertname"]
      receiver: "slack"

      # Configuring some alerts to go into the void...
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "InfoInhibitor"
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"

    receivers:
    - name: "null"
    - name: "slack"
      # https://prometheus.io/docs/alerting/latest/configuration/#slack_config
      slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack_webhook_url
        channel: "#_bettervoting"
        send_resolved: true
        # TODO: Should we enable this?
        # https://prometheus.io/docs/alerting/latest/notification_examples/#ranging-over-all-received-alerts
        # title: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        # text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
    secrets:
    - alertmanager-slack
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: "basic"
      nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
      nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    hosts:
    - alertmanager.prod.equal.vote
    tls:
    - secretName: alertmanager-tls
      hosts:
      - alertmanager.prod.equal.vote
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 76m
        memory: 440Mi
      limits:
        memory: 440Mi
    storage:
      enabled: true
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 1Gi
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: "basic"
      nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
      nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
    hosts:
    - prometheus.prod.equal.vote
    tls:
    - secretName: prometheus-tls
      hosts:
      - prometheus.prod.equal.vote
grafana:
  # 512Mi, not the 232Mi KRR recommended on 2026-05-04. That number was measured
  # against Grafana 12.4.2 (chart 82.17.1), which peaked at 184Mi. Chart 90.0.0
  # ships Grafana 13.2.1, whose unified-storage bleve search index and background
  # plugin installer put the idle floor at ~213Mi, so every dashboard load crossed
  # 232Mi and got the container OOMKilled -- which is what ingress-nginx turned
  # into 502/503s. Do not lower this from a KRR run taken while the old limit was
  # clamping the peak; re-measure with headroom first.
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 100Mi
      limits:
        memory: 100Mi
  admin:
    existingSecret: grafana
  additionalDataSources:
  - name: loki
    type: loki
    url: http://loki.loki:3100
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
    - grafana.prod.equal.vote
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.prod.equal.vote
