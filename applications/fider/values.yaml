# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.0)) <(yq eval '. * load("values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.0))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.0) values.yaml

replicaCount: 1
image:
  repository: getfider/fider
  tag: stable
ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: feedback.prod.equal.vote
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: fider-tls
      hosts:
        - feedback.prod.equal.vote
env:
  - name: BASE_URL
    value: "https://feedback.prod.equal.vote"
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: fider
        key: JWT_SECRET
  # The password is declared in git (secrets/fider-db-secrets.enc.yaml) and
  # handed to CNPG via cluster.initdb.secret, so the operator no longer
  # publishes a fider-db-app secret with a ready-made `uri`. Assemble the URL
  # here instead, injecting the one stored copy of the password via Kubernetes
  # dependent-env expansion -- FIDER_DB_PASSWORD must stay above DATABASE_URL
  # for $() to resolve. The password is deliberately alphanumeric: this is
  # string interpolation, not URL encoding (see #43).
  # No sslmode, so lib/pq defaults to `require`; CNPG always serves TLS.
  - name: FIDER_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fider-db-creds
        key: password
  - name: DATABASE_URL
    value: "postgresql://fider:$(FIDER_DB_PASSWORD)@fider-db-rw.fider:5432/fider"
  - name: EMAIL_NOREPLY
    value: "noreply@bettervoting.com"
  - name: EMAIL_SMTP_HOST
    value: "smtp.sendgrid.net"
  - name: EMAIL_SMTP_PORT
    value: "587"
  - name: EMAIL_SMTP_USERNAME
    value: "apikey"
  - name: EMAIL_SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fider
        key: EMAIL_SMTP_PASSWORD
  - name: LOG_LEVEL
    value: "info"
  - name: BLOB_STORAGE
    value: "sql"
service:
  port: 3000
resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    memory: 200Mi
livenessProbe:
  httpGet:
    port: 3000
readinessProbe:
  httpGet:
    port: 3000
