apiVersion: "argoproj.io/v1alpha1"
kind: "ApplicationSet"
metadata:
  name: "applications"
spec:
  generators:
    - git:
        repoURL: "https://github.com/Equal-Vote/argocd.git"
        revision: "HEAD"
        files:
          - path: "applications/**/config.json"
  template:
    metadata:
      name: "{{application.name}}"
      labels:
        # Retained for grouping and for the ArgoCD UI. This no longer drives sync
        # ordering: the RollingSync strategy that consumed it was removed, because
        # the only real cross-app dependency in this cluster is cnpg-operator's
        # CRDs before fider-db's Cluster resource, and the retry policy below
        # covers that on its own.
        phase: "{{application.phase}}"
      annotations:
        # Diff against a server-side dry-run apply instead of the client-side
        # three-way merge. Every app below syncs with ServerSideApply=true, which
        # stops ArgoCD writing the last-applied-configuration annotation the
        # three-way merge depends on -- so API-server defaults and mutating
        # webhooks read as drift and the app never reaches Synced.
        #
        # This is a *compare* option, not a sync option: it is only read from
        # this annotation or from controller.diff.server.side in
        # argocd-cmd-params-cm. Putting ServerSideDiff in syncOptions below is
        # silently ignored.
        # https://argo-cd.readthedocs.io/en/stable/user-guide/diff-strategies/#server-side-diff
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: "{{argocd.project}}"
      sources:
        - repoURL: "{{application.chartURL}}"
          targetRevision: "{{application.revision}}"
          chart: "{{application.chartName}}"
          helm:
            valueFiles:
            - "$values/applications/{{application.name}}/values.yaml"
        - repoURL: "{{application.valuesURL}}"
          ref: "values"
          targetRevision: "{{application.valuesRevision}}"
      destination:
        name: "{{cluster.name}}"
        namespace: "{{cluster.namespace}}"
      syncPolicy:
        automated:
          # With RollingSync removed this is live for the first time. Previously
          # the ApplicationSet controller set `automated.enabled: false` on every
          # generated Application and drove syncs itself, which left selfHeal
          # declared but inert.
          selfHeal: true

          # Without this, ArgoCD reconciles drift in one direction only: it reverts
          # a resource someone modifies, but leaves a resource deleted from git
          # running forever. That also makes revocation impossible -- when a chart
          # tightens its RBAC between versions the old permissive binding stays in
          # force while the app still reports Synced.
          #
          # Nothing here is a PVC. Every PersistentVolumeClaim in this cluster is
          # created by a controller (StatefulSet volumeClaimTemplate, the CNPG
          # operator, prometheus-operator), not by Helm, so ArgoCD manages none of
          # them and prune cannot reach them.
          prune: true
        retry:
          # Covers the one ordering dependency the phases used to enforce:
          # fider-db creates a postgresql.cnpg.io Cluster, whose CRD comes from
          # cnpg-operator. If fider-db syncs first it fails with "no matches for
          # kind Cluster" and succeeds on a later attempt.
          limit: 5
          backoff:
            duration: "15s"
            factor: 2
            maxDuration: "5m"
        syncOptions:
          - CreateNamespace=true

          # This is fix this error: https://foxutech.medium.com/how-to-fix-too-long-must-have-at-most-262144-bytes-in-argocd-2a00cddbbe99
          - ServerSideApply=true

          # Delete removed resources only after everything else has synced. This
          # matters for the devopscoop app chart 0.11.0 rename, which drops the
          # "-app" suffix from every resource: the old Deployment and Ingress are
          # removed only once their replacements are up.
          - PruneLast=true

      ignoreDifferences:
        # Two controllers besides ArgoCD write to cert-manager's validating
        # webhook, and neither field is in the chart:
        #
        #   cert-manager-cainjector (Apply)  -> webhooks[].clientConfig.caBundle
        #   admissionsenforcer (Update)      -> webhooks[].namespaceSelector
        #
        # admissionsenforcer is the AKS admission enforcer. The chart renders
        # namespaceSelector with one matchExpression and AKS appends two more,
        # excluding control-plane and AKS-managed namespaces. matchExpressions is
        # an atomic list, so a server-side diff would reset it to the chart's
        # single entry -- which is why ServerSideDiff alone does not settle this.
        #
        # Left alone, cert-manager can never reach Synced. This originally mattered
        # because RollingSync held its whole step at Waiting; that strategy is gone,
        # but the rule stays -- an app that is permanently OutOfSync is one you stop
        # reading, and it would mask real drift.
        #
        # managedFieldsManagers ignores whatever those two managers own rather than
        # naming field paths, so it adapts if they change which fields they touch,
        # and still reports drift introduced by anyone else -- including a human
        # with kubectl. The name selector keeps this scoped to cert-manager's
        # webhook; no other app in this ApplicationSet owns that resource.
        - group: "admissionregistration.k8s.io"
          kind: "ValidatingWebhookConfiguration"
          name: "cert-manager-webhook"
          managedFieldsManagers:
            - "cert-manager-cainjector"
            - "admissionsenforcer"
