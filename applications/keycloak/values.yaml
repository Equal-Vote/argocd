# dyff between <(yq . <(helm show values bitnami/keycloak --version v21.0.3)) <(yq eval '. * load("values.yaml")' <(helm show values bitnami/keycloak --version v21.0.3))
# vim -O <(helm show values bitnami/keycloak --version v21.0.3) values.yaml

image:
  repository: bitnamilegacy/keycloak
keycloakConfigCli:
  image:
    repository: bitnamilegacy/keycloak-config-cli

auth:
  adminUser: "admin" # this doesn't appear to work, I used "user" as the login name instead
  existingSecret: "keycloak"

production: true

ingress:
  enabled: true
  hostname: "keycloak.prod.equal.vote"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
  servicePort: "https"
  tls: true

tls:
  enabled: true
  autoGenerated: true

# 768Mi, up from 565Mi. keycloak-0 was OOMKilled at 565Mi: its 10d peak
# (measured 2026-10-05) was 564Mi, pinned to the limit. The JVM sizes its heap
# as a percentage of the container limit, so the non-heap overhead (metaspace,
# threads, code cache) is what crosses it.
resources:
  requests:
    cpu: 10m
    memory: 768Mi
  limits:
    memory: 768Mi

postgresql:
  enabled: true
  auth:
    existingSecret: "keycloak-postgresql"
  architecture: standalone
  image:
    repository: bitnamilegacy/postgresql
  # NOTE: must live under `primary`. The bitnami/postgresql subchart has no
  # top-level `resources`, so it used to be dropped and the pod ran on the chart's
  # "nano" preset (128Mi/192Mi). 10d peak 33Mi, measured 2026-10-05.
  primary:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  metrics:
    image:
      repository: bitnamilegacy/os-shell
