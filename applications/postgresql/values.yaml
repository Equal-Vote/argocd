# dyff between <(yq . <(helm show values bitnami/postgresql --version v15.2.9)) <(yq eval '. * load("values.yaml")' <(helm show values bitnami/postgresql --version v15.2.9))
# vim -O <(helm show values bitnami/postgresql --version v15.2.9) values.yaml

image:
  repository: bitnamilegacy/postgresql
volumePermissions:
  image:
    repository: bitnamilegacy/os-shell
metrics:
  enabled: true
  image:
    # Was bitnamilegacy/os-shell, copy-pasted from the volumePermissions block above
    # when Bitnami moved their images. The chart default here is postgres-exporter,
    # and os-shell has no 0.15.0-debian-12-r17 tag, so the exporter would have gone
    # straight to ImagePullBackOff. It stayed latent only because metrics.enabled
    # defaults to false, which meant the container was never rendered at all.
    repository: bitnamilegacy/postgres-exporter
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi
  serviceMonitor:
    enabled: true
    # kube-prometheus-stack runs Prometheus with serviceMonitorSelectorNilUsesHelmValues
    # set, which narrows discovery to ServiceMonitors carrying its release label.
    # Without this the exporter is scraped by nobody and every dashboard panel reads
    # "No data" while looking perfectly healthy.
    labels:
      release: kube-prometheus-stack
tls:
  enabled: true
  autoGenerated: true
auth:
  username: "starvote"
  database: "starvote"
  replicationUser: "replica"
  existingSecret: "postgresql"
  secretKeys:
    userPasswordKey: "application"
    replicationPasswordKey: "replicator"
primary:
  # 1Gi, down from 2Gi, for Standard_D2ps_v6 nodes (2 vCPU, 8Gi, ~5.7Gi
  # allocatable after the AKS kubelet reservation). Measured 2026-10-05 over the
  # 10d Prometheus window: 845Mi peak working set with shared_buffers at 512MB,
  # 580MB database, 35 backends max. shared_buffers is halved below, which takes
  # ~256MB off that peak. Request == limit so this pod is last in line for
  # kubelet eviction.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  extendedConfiguration: |
    shared_buffers = 256MB              # 25% of 1Gi memory; the OS page cache holds the rest of the ~580MB database
    effective_cache_size = 768MB        # 75% of 1Gi memory (planner hint only, not actual allocation)
    work_mem = 4MB                      # Back to the default; 35 backends x 8MB no longer fits comfortably
    maintenance_work_mem = 64MB         # Back to the default for the smaller memory budget
    checkpoint_timeout = 10min          # Increased from 5min to reduce checkpoint frequency
    min_wal_size = 128MB                # Raised from 32MB: fewer WAL segment recycles between checkpoints
    max_wal_size = 512MB                # Raised from 128MB; pg_wal shares the 8Gi PVC, which is 7.2Gi free
