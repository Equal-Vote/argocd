# dyff between <(yq . <(helm show values bitnami/postgresql --version v15.2.9)) <(yq eval '. * load("values.yaml")' <(helm show values bitnami/postgresql --version v15.2.9))
# vim -O <(helm show values bitnami/postgresql --version v15.2.9) values.yaml

image:
  repository: bitnamilegacy/postgresql
volumePermissions:
  image:
    repository: bitnamilegacy/os-shell
metrics:
  image:
    repository: bitnamilegacy/os-shell
tls:
  enabled: true
  autoGenerated: true
auth:
  username: "starvote"
  database: "starvote"
  replicationUser: "replica"
  existingSecret: "postgresql"
  secretKeys:
    userPasswordKey: "application"
    replicationPasswordKey: "replicator"
primary:
  # Sized for Standard_B4ps_v2 nodes (4 vCPU, 16Gi, ~12Gi allocatable after the
  # AKS kubelet reservation). 2Gi still leaves a single node able to hold every
  # pod in the cluster if the other one goes away.
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 2Gi
  extendedConfiguration: |
    shared_buffers = 512MB              # 25% of 2Gi memory (the whole ~600MB database fits here)
    effective_cache_size = 1GB          # 50% of 2Gi memory (planner hint only, not actual allocation)
    work_mem = 8MB                      # Raised from 4MB now that there is memory to spare
    maintenance_work_mem = 128MB        # Raised from 64MB to speed up VACUUM and index builds
    checkpoint_timeout = 10min          # Increased from 5min to reduce checkpoint frequency
    min_wal_size = 128MB                # Raised from 32MB: fewer WAL segment recycles between checkpoints
    max_wal_size = 512MB                # Raised from 128MB; pg_wal shares the 8Gi PVC, which is 7.2Gi free
