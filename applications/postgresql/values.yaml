# dyff between <(yq . <(helm show values bitnami/postgresql --version v15.2.9)) <(yq eval '. * load("values.yaml")' <(helm show values bitnami/postgresql --version v15.2.9))
# vim -O <(helm show values bitnami/postgresql --version v15.2.9) values.yaml

image:
  repository: bitnamilegacy/postgresql
volumePermissions:
  image:
    repository: bitnamilegacy/os-shell
metrics:
  enabled: true
  image:
    # Was bitnamilegacy/os-shell, copy-pasted from the volumePermissions block above
    # when Bitnami moved their images. The chart default here is postgres-exporter,
    # and os-shell has no 0.15.0-debian-12-r17 tag, so the exporter would have gone
    # straight to ImagePullBackOff. It stayed latent only because metrics.enabled
    # defaults to false, which meant the container was never rendered at all.
    repository: bitnamilegacy/postgres-exporter
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
  serviceMonitor:
    enabled: true
    # kube-prometheus-stack runs Prometheus with serviceMonitorSelectorNilUsesHelmValues
    # set, which narrows discovery to ServiceMonitors carrying its release label.
    # Without this the exporter is scraped by nobody and every dashboard panel reads
    # "No data" while looking perfectly healthy.
    labels:
      release: kube-prometheus-stack
tls:
  enabled: true
  autoGenerated: true
auth:
  username: "starvote"
  database: "starvote"
  replicationUser: "replica"
  existingSecret: "postgresql"
  secretKeys:
    userPasswordKey: "application"
    replicationPasswordKey: "replicator"
primary:
  resources:
    requests:
      cpu: 34m
      memory: 256Mi
    limits:
      memory: 256Mi
  extendedConfiguration: |
    shared_buffers = 64MB              # 25% of 256Mi memory (lower than default due to memory constraints)
    effective_cache_size = 128MB        # 50% of 256Mi memory (planner hint only, not actual allocation)
    checkpoint_timeout = 10min          # Increased from 5min to reduce checkpoint frequency
    min_wal_size = 32MB                 # Reduced from 80MB (small database, less WAL overhead)
    max_wal_size = 128MB                # Reduced from 400MB (small database, smaller WAL footprint)
