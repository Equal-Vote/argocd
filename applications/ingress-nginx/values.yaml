# dyff between <(yq . <(helm show values ingress-nginx/ingress-nginx --version v4.15.1)) <(yq eval '. * load("values.yaml")' <(helm show values ingress-nginx/ingress-nginx --version v4.15.1))
# vim -O <(helm show values ingress-nginx/ingress-nginx --version v4.15.1) values.yaml

controller:
# Newer charts seem to establish externalTrafficPolicy to Cluster instead of Local, breaks in Azure
# https://github.com/kubernetes/ingress-nginx/issues/10863
  service:
    externalTrafficPolicy: "Local"
  ingressClassResource:
    default: true
  replicaCount: 2
  # Steady state is ~70Mi after a restart, settling around ~90Mi within a day.
  # A config reload briefly runs old and new nginx workers side by side, so the
  # limit needs room above that plateau. 100Mi OOMKilled both replicas at once
  # (2026-04 and again 2026-09-23 17:47, 4 minutes after an Ingress change);
  # KRR sizes from average usage and does not see those reload spikes.
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 256Mi

  # The controller serves no metrics at all by default (metrics.enabled is false
  # in the chart), which is why nothing was scraping it and the Grafana dashboard
  # in kube-prometheus-stack would otherwise render empty panels.
  #
  # This does NOT widen the public LoadBalancer: the chart puts port 10254 on a
  # separate ClusterIP Service (ingress-nginx-controller-metrics) and leaves the
  # LoadBalancer with 80/443 only.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        # This Prometheus selects ServiceMonitors with
        # serviceMonitorSelector.matchLabels.release=kube-prometheus-stack.
        # Without this label the ServiceMonitor is created and then ignored.
        # (Its namespace selector is empty, so cross-namespace is fine.)
        release: kube-prometheus-stack
