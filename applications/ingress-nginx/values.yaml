# dyff between <(yq . <(helm show values ingress-nginx/ingress-nginx --version v4.15.1)) <(yq eval '. * load("values.yaml")' <(helm show values ingress-nginx/ingress-nginx --version v4.15.1))
# vim -O <(helm show values ingress-nginx/ingress-nginx --version v4.15.1) values.yaml

controller:
# Newer charts seem to establish externalTrafficPolicy to Cluster instead of Local, breaks in Azure
# https://github.com/kubernetes/ingress-nginx/issues/10863
  service:
    externalTrafficPolicy: "Local"
  ingressClassResource:
    default: true
  replicaCount: 2

  # Keep the two replicas on different nodes. Without this the scheduler placed
  # both on aks-agentpool-...-vmss000000 (2026-11-24). With
  # externalTrafficPolicy: Local the Azure load balancer only sends traffic to
  # nodes that run a controller pod, so all ingress traffic entered through
  # that one node, and losing it took down every site.
  #
  # - DoNotSchedule: a hard rule. The default scheduler spreading is only a
  #   scoring preference, and resource fit outweighed it.
  # - matchLabelKeys pod-template-hash: count only pods from the same
  #   ReplicaSet, so during a rollout the surge pod can land on either node and
  #   the new pods spread among themselves.
  # - nodeTaintsPolicy Honor: a cordoned node (unschedulable taint) stops
  #   counting as a domain, so draining one node can reschedule its replica
  #   next to the other one instead of leaving it Pending.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      nodeTaintsPolicy: Honor
      matchLabelKeys:
        - pod-template-hash
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/instance: ingress-nginx
          app.kubernetes.io/component: controller
  # Steady state is ~70Mi after a restart, settling around ~90Mi within a day.
  # A config reload briefly runs old and new nginx workers side by side, so the
  # limit needs room above that plateau. 100Mi OOMKilled both replicas at once
  # (2026-04 and again 2026-09-23 17:47, 4 minutes after an Ingress change);
  # KRR sizes from average usage and does not see those reload spikes.
  # The request sits at 128Mi, above the plateau (10d peak 96Mi, measured
  # 2026-10-05), while the 256Mi limit covers the brief reload overlap. That
  # lets the pair fit on half-size Standard_D2ps_v6 nodes.
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

  # The controller serves no metrics at all by default (metrics.enabled is false
  # in the chart), which is why nothing was scraping it and the Grafana dashboard
  # in kube-prometheus-stack would otherwise render empty panels.
  #
  # This does NOT widen the public LoadBalancer: the chart puts port 10254 on a
  # separate ClusterIP Service (ingress-nginx-controller-metrics) and leaves the
  # LoadBalancer with 80/443 only.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        # This Prometheus selects ServiceMonitors with
        # serviceMonitorSelector.matchLabels.release=kube-prometheus-stack.
        # Without this label the ServiceMonitor is created and then ignored.
        # (Its namespace selector is empty, so cross-namespace is fine.)
        release: kube-prometheus-stack
